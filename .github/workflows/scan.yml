name: Security Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Semgrep
        run: pip install semgrep==1.131.0

      - name: Rodar Semgrep (SARIF)
        run: semgrep scan --config auto --sarif --output semgrep.sarif .
        continue-on-error: true

      - name: Rodar Trivy SCA (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          format: sarif
          output: trivy-sca.sarif
        continue-on-error: true

      - name: Rodar Trivy secrets (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: secret
          format: sarif
          output: trivy-secrets.sarif
        continue-on-error: true

      - name: Rodar Trivy IaC (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: misconfig
          format: sarif
          output: trivy-iac.sarif
        continue-on-error: true

      - name: Guardar os SARIFs gerados
        uses: actions/upload-artifact@v4
        with:
          name: sarif-reports
          path: |
            semgrep.sarif
            trivy-sca.sarif
            trivy-secrets.sarif
            trivy-iac.sarif

      - name: Enviar SARIFs pra Elma
        env:
          ELMA_API_URL: ${{ secrets.ELMA_API_URL }}
          ELMA_API_KEY: ${{ secrets.ELMA_API_KEY }}
          REPOSITORIO: ${{ github.repository }}
          FECHAR_AUSENTES: ${{ github.ref_name == github.event.repository.default_branch }}
          FAIL_ON: HIGH
        run: |
          bash scripts/enviar_elma.sh \
            semgrep.sarif:sast \
            trivy-sca.sarif:sca \
            trivy-secrets.sarif:secrets \
            trivy-iac.sarif:iac
